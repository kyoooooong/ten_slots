spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC  # OffsetDateTime/ZonedDateTime을 UTC로 저장·조회 — 서버·DB·애플리케이션 시각 기준 통일

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ten-slots  # Grafana 대시보드에서 애플리케이션 구분용

payment:
  gateway:
    timeout-seconds: 10

resilience4j:
  circuitbreaker:
    instances:
      stockDecrease:
        sliding-window-type: count-based
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 500ms   # Redis 응답이 500ms 초과하면 slow call로 집계
        slow-call-rate-threshold: 50           # slow call 비율 50% 초과 시 OPEN — 응답은 하지만 지연 장애도 감지
