worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 예약 API: 00시 트래픽 폭증 방어 — IP당 초당 10req, burst 30개까지 즉시 허용
    limit_req_zone $binary_remote_addr zone=booking_limit:10m rate=10r/s;
    # 주문서 API: 00시 직전 새로고침 폭격 방어 — IP당 초당 30req (예약보다 여유있게)
    limit_req_zone $binary_remote_addr zone=checkout_limit:10m rate=30r/s;

    upstream app {
        server app1:8080;
        server app2:8080;
    }

    server {
        listen 80;

        location /api/v1/booking {
            limit_req zone=booking_limit burst=30 nodelay;
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # PG 타임아웃(10s) + 여유 — Nginx가 먼저 끊지 않도록 설정
            proxy_read_timeout 15s;
        }

        location /api/v1/checkout {
            limit_req zone=checkout_limit burst=50 nodelay;
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 5s;
        }

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
